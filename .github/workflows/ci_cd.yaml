name: CI_CD

on:
  push:
    branches:
      - main
  
  workflow_dispatch:

env:
  AWS_REGION: ca-central-1
  ECR_API_REPOSITORY: churn-detector-api
  ECR_STREAMLIT_REPOSITORY: churn-detector-streamlit
  ECS_CLUSTER: churn-detector-cluster
  ECS_SERVICE: churn-detector-service

jobs:
  # CI
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-api.txt
        pip install pytest httpx
        pip install "dvc[S3]"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
        aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        aws-region: ${{env.AWS_REGION}}

    - name: Pull API model with DVC
      run: |
        dvc pull outputs/models/churn_model.pkl

    - name: Run tests
      run: |
        python -m pytest -v

    # CD

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DVC
        run: |
          pip install "dvc[s3]"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{env.AWS_REGION}}
      
      - name: Pull API model with DVC
        run: |
          dvc pull outputs/models/churn_model.pkl

      - name: Pull streamlit frontend_data with DVC
        run: |
          dvc pull outputs/frontend_data/metrics.csv
          dvc pull outputs/frontend_data/confusion_matrix.csv
          dvc pull outputs/frontend_data/feature_importance.csv
        
      - name: Pull clean_data with DVC
        run: |
          dvc pull outputs/clean_data/clean_data.csv

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build API Image
        run: |
          docker build \
            -f Dockerfile.api -t ${{steps.login-ecr.outputs.registry}}/${{env.ECR_API_REPOSITORY}}:latest .

      - name: Push API Image
        run: |
          docker push ${{steps.login-ecr.outputs.registry}}/${{env.ECR_API_REPOSITORY}}:latest

      - name: Build Streamlit Image
        run: |
          docker build -f Dockerfile.streamlit -t ${{steps.login-ecr.outputs.registry}}/${{env.ECR_STREAMLIT_REPOSITORY}}:latest .

      - name: Push Streamlit Image
        run: |
          docker push ${{steps.login-ecr.outputs.registry}}/${{env.ECR_STREAMLIT_REPOSITORY}}:latest

      # ECS Deployment
      - name: Force ECS Deployment
        run: |
          aws ecs update-service \
            --cluster ${{env.ECS_CLUSTER}} \
            --service ${{env.ECS_SERVICE}} \
            --desired-count 1 \
            --force-new-deployment \
            --region ${{env.AWS_REGION}}